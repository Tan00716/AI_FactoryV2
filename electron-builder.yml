# electron-builder packaging config for the AI Factory desktop app.
# See docs/packaging.md for per-platform build commands and signing status.
#
# Layout contract (verified against apps/desktop/electron/main.ts):
#   - App entry: root package.json "main" -> apps/desktop/dist-electron/main.js
#   - Production renderer: main.ts loads <app>/apps/desktop/renderer/index.html,
#     so the Vite output (apps/desktop/dist) is mapped to apps/desktop/renderer
#     below. Vite is built with base './' so its assets resolve under file://.
#   - Production backend: main.ts spawns process.resourcesPath/server/index.js,
#     so apps/server/dist is copied to resources/server via extraResources, and
#     every workspace package (package.json + dist) is staged under
#     resources/server/node_modules/@ai-factory/<pkg>, so the backend's
#     require('@ai-factory/*') resolves exactly like in the dev monorepo.
#     The packages have zero external runtime dependencies (node: builtins
#     only; the DB is node:sqlite), so no further node_modules are needed.
appId: com.aifactory.ide
productName: AI Factory
copyright: Copyright © 2026 AI Factory
directories:
  output: release
files:
  - package.json
  # Electron main process (compiled from apps/desktop/electron)
  - apps/desktop/dist-electron/**/*
  # Renderer: Vite build output, relocated to the path main.ts loadFile()s
  - from: apps/desktop/dist
    to: apps/desktop/renderer
    filter:
      - "**/*"
      - "!**/*.map"
extraResources:
  # Local backend entry + routes (spawned from process.resourcesPath)
  - from: apps/server/dist
    to: server
    filter:
      - "**/*"
      - "!**/*.map"
  # Backend runtime deps: the workspace packages it requires by name
  - from: packages
    to: server/node_modules/@ai-factory
    filter:
      - "*/package.json"
      - "*/dist/**/*"
      - "!*/dist/**/*.map"
      - "!*/dist/tests/**"
      - "!*/dist/demo/**"
win:
  icon: apps/desktop/build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Factory
mac:
  icon: apps/desktop/build/icon.png
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  icon: apps/desktop/build/icon.png
  executableName: ai-factory
  # package.json "desktopName" is used by Electron as app_id / WM_CLASS;
  # syncDesktopName makes the .desktop file name match it so desktop
  # environments associate running windows with the launcher entry.
  syncDesktopName: true
  target:
    - AppImage
  category: Development
  maintainer: AI Factory
