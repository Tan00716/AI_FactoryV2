# Copilot Setup Steps — generated from the same DevEnvSpec as .devcontainer/devcontainer.json.
# Generated by @ai-factory/qa renderSetupStepsYaml(); do not hand-edit — edit the spec instead.
# To enable: move this file to .github/workflows/copilot-setup-steps.yml

name: "Copilot Setup Steps"

# Automatically run when changed, so the setup stays validated.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:

  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Preflight checks
        run: node -e "const m=Number(process.versions.node.split('.')[0]); if(m<22){console.error('node >=22 required, got '+process.versions.node);process.exit(1)}"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
